name: Feature request
description: Suggest a new search feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! Issues in Portuguese are fine too.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find or do?
      description: Describe the search you want to make, or the part that is annoying today.
      placeholder: I want to find every machine that uses more than 100 FE/t...
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Suggested syntax or behavior
      description: How would you like to type it, or how should it work?
      placeholder: "$\"FE/t\">100"

  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: Does another mod already do this (NEI/GTNH, JEI, REI...)? Links or screenshots help.
