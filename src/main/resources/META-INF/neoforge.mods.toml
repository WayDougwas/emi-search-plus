modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/WayDougwas/emi-search-plus/issues"

[[mods]]
modId = "emisearchplus"
version = "${mod_version}"
displayName = "EMI Search Plus (EMIS+)"
authors = "WayDougwas"
displayURL = "https://github.com/WayDougwas/emi-search-plus"
credits = "Search syntax inspired by the Extended+ search mode of GT New Horizons' NotEnoughItems. Built on top of EMI by Emi."
logoFile = "emisearchplus_logo.png"
logoBlur = false
description = '''Client-side EMI add-on that makes searching much more powerful:

- Extended+ search syntax (from GTNH's NEI): { } groups, | OR, - NOT, r/regex/, "quotes", optional explicit & AND.
- A search bar inside the recipe screen: <inputs >outputs ^catalysts, !category, ?inv (craftable from inventory).
- New prefixes: &id, %creative tab, ~stack type, =whole word, $tooltip>number comparisons, * wildcards.
- Accent-insensitive, English-name, initials and typo-tolerant search.
- Autocomplete with counts, saved history with pins, result counter, slot highlighting.
- "Search by" menu for the hovered item, calculator in the search bar, and an in-game help screen (F1).

Everything is configurable from EMI's own config screen.'''

[[mixins]]
config = "emisearchplus.mixins.json"

[[dependencies.emisearchplus]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.emisearchplus]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.emisearchplus]]
modId = "emi"
type = "required"
versionRange = "[1.1.24,)"
ordering = "AFTER"
side = "CLIENT"
